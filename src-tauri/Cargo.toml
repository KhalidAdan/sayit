[package]
name = "sayit"
version = "0.1.0"
description = "The key that listens. Push-to-talk local dictation for Windows."
authors = ["Khalid"]
edition = "2021"

[lib]
# The `_lib` suffix avoids a lib/bin name collision on Windows,
# see https://github.com/rust-lang/cargo/issues/8519
name = "sayit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.16"
hound = "3.5"
arboard = "3"
enigo = "0.6"
reqwest = { version = "0.12", default-features = false, features = ["multipart", "json"] }
tokio = { version = "1", features = ["time"] }
rodio = "0.20"
