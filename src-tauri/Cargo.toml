[package]
name = "sayit"
version = "0.3.1"
license = "MIT"
description = "The key that listens. Local dictation for Windows and Linux."
authors = ["Khalid"]
edition = "2021"

[lib]
# The `_lib` suffix avoids a lib/bin name collision on Windows,
# see https://github.com/rust-lang/cargo/issues/8519
name = "sayit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# `tauri build` enables this automatically. Direct release builds and CI must
# opt in explicitly so windows load the embedded frontend, never devUrl.
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.16"
hound = "3.5"
arboard = { version = "3", features = ["wayland-data-control"] }
reqwest = { version = "0.12", default-features = false, features = ["multipart", "json", "stream"] }
tokio = { version = "1", features = ["time"] }
rodio = "0.20"
sha2 = "0.10"
futures-util = "0.3"
flate2 = "1"
tar = "0.4"
base64 = "0.22"
minisign-verify = "0.2"

[target.'cfg(windows)'.dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
enigo = "0.6"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
] }

[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.13"
ksni = { version = "0.3", features = ["blocking"] }
libc = "0.2"
