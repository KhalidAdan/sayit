# Layer 0 on both supported operating systems. Device/GPU/desktop tests stay
# on the real machines; every pure contract and every cfg branch compiles here.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # The platform layer's one rule: OS cfgs live in platform/mod.rs and
      # nowhere else. The matrix legs prove each backend implements the full
      # Platform trait; this proves nobody went around it.
      - name: platform cfg tripwire
        shell: bash
        working-directory: src-tauri
        run: |
          if grep -rnE 'cfg(_attr)?!?\(.*\b(windows|target_os|target_family|unix)\b' \
               --include='*.rs' src \
             | grep -vE '^src/platform/mod\.rs:|windows_subsystem'; then
            echo "::error::platform cfg found outside src/platform/mod.rs — implement it in the Platform trait instead"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Install Linux build libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libasound2-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: cargo test
        working-directory: src-tauri
        run: cargo test
