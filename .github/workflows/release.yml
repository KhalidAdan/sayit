# Release bundling in the cloud: runs on version tags (v0.2.0, ...) or the
# "Run workflow" button. Uploads the exe + installers as artifacts.
#
# The exe resolves its companions at RUNTIME (paths.rs): env override,
# next-to-exe, or repo-ancestor walk. To use a CI artifact: drop sayit.exe
# anywhere inside a clone that has sidecar/ and models/ populated (see
# docs/sidecar.md), or place those folders next to the exe.
name: Release build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  bundle:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm run tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: sayit-windows
          path: |
            src-tauri/target/release/sayit.exe
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
