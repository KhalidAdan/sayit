<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>sayit waveform</title>
    <style>
      /* Transparent window: the pill is the only visible surface.
         Dark-mode rules: no outer shadow; definition comes from an inset
         ring (white/6); surface sits just above pure black (zinc-950). */
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
      }
      #pill {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(9, 9, 11, 0.88);
        border-radius: 9999px;
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.06);
      }
      canvas {
        width: calc(100% - 32px);
        height: calc(100% - 26px);
      }
    </style>
  </head>
  <body>
    <div id="pill"><canvas id="wave"></canvas></div>
    <script type="module" src="/src/waveform.ts"></script>
  </body>
</html>
